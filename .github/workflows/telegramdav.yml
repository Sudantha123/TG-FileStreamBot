name: TelegramDAV build

on:
  push:
    branches: [ main, telegramdav-core ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegramdav
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Test
        run: go test ./...
      - name: Build Linux amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o ../telegramdav-linux-amd64 ./cmd/telegramdav
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: telegramdav-linux-amd64
          path: telegramdav-linux-amd64
